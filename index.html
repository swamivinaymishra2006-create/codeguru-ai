<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeGuru AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1a2f;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 15px;
      background: #13294b;
      font-size: 20px;
      font-weight: bold;
    }

    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user {
      background: #2d6cdf;
      align-self: flex-end;
    }

    .bot {
      background: #1f2f46;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #13294b;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      background: #2d6cdf;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #1e4fbf;
    }
  </style>
</head>

<body>

<header>CodeGuru AI</header>

<div id="chat-box"></div>

<div class="input-area">
  <input id="user-input" type="text" placeholder="Ask coding question..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  const inputField = document.getElementById("user-input");
  const message = inputField.value.trim();

  if (!message) return;

  const chatBox = document.getElementById("chat-box");

  // show user message
  chatBox.innerHTML += `<div class="message user">${message}</div>`;

  inputField.value = "";

  try {
    const res = await fetch("https://codeguru-backend.onrender.com/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        language: "Java"
      })
    });

    const data = await res.json();

    // show bot reply
    chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;

    chatBox.scrollTop = chatBox.scrollHeight;

  } catch (error) {
    chatBox.innerHTML += `<div class="message bot">Error connecting backend</div>`;
  }
}
</script>

</body>
</html>
